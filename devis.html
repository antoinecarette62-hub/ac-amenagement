<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="images/logo.png" />
<title>Demander un devis — Ac Ligna</title>
<meta name="description" content="Demandez un devis pour votre cuisine, dressing ou claustra sur mesure. Ac Ligna vous recontacte sous 48h dans les Hauts-de-France." />
<link rel="canonical" href="https://acligna.fr/devis.html" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .bloc-recap { border: 1px solid rgba(201,166,107,0.3); background: rgba(201,166,107,0.05); border-radius: 0.75rem; padding: 1rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center; }
  .bloc-recap img { width: 3.5rem; height: 3.5rem; border-radius: 0.5rem; object-fit: cover; background: var(--anthracite); }
  .bloc-recap ul { list-style: none; font-size: 0.85rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem 1rem; }
</style>
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="section-fond-anime">
    <canvas class="canvas-fond-anime" aria-hidden="true"></canvas>
    <div class="motif-fond-anime" aria-hidden="true"></div>
    <div class="voile-fond-anime" aria-hidden="true"></div>
    <div class="container contenu-fond-anime" style="max-width:42rem;">
      <p class="fil-ariane"><a href="index.html">Accueil</a> › <span class="actif">Devis</span></p>

      <div class="text-center reveal">
        <p class="eyebrow">Sur mesure</p>
        <h1>Parlons de votre projet.</h1>
        <p class="texte-muted mt-4">Remplissez ce formulaire, un membre de notre équipe vous recontacte sous 48h ouvrées.</p>
      </div>

      <div id="zone-formulaire" class="reveal mt-8" style="transition-delay:0.1s;"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/fond-anime.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const donnees = Donnees.charger();
  const zone = document.getElementById("zone-formulaire");

  // Le prénom saisi est réinjecté tel quel dans le message de confirmation :
  // on l'échappe pour éviter qu'une saisie du type "<img onerror=...>" ne
  // s'exécute dans la page.
  function echapperHtml(texte) {
    return texte.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Résout soit un produit précis (?produit=slug), soit une configuration libre.
  const produit = params.get("produit") ? donnees.produits.find((p) => p.slug === params.get("produit")) : null;
  const config = !produit && (params.get("largeur") || params.get("matiere"))
    ? {
        collectionNom: (donnees.collections.find((c) => c.slug === params.get("collection")) || {}).nom,
        modele: params.get("modele"),
        largeur: params.get("largeur"), hauteur: params.get("hauteur"), epaisseur: params.get("epaisseur"),
        matiere: params.get("matiere"), couleur: params.get("couleur"), prix: params.get("prix"),
      }
    : null;

  // Un claustra précis (catalogue ou configurateur) porte déjà sa propre
  // catégorie et ses dimensions : pas besoin de redemander un « type de
  // projet » générique ni un budget, le récapitulatif ci-dessous suffit.
  const claustraPrecis = !!(produit || config);

  let recapHtml = "";
  if (produit) {
    const collectionProduit = donnees.collections.find((c) => c.slug === produit.collectionSlug);
    recapHtml = `<div class="bloc-recap" style="display:block;">
      <div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem;">
        <img src="${produit.imagePrincipale}" alt="${produit.nom}" />
        <div><p class="eyebrow" style="margin:0;">Produit sélectionné</p><p style="font-family:'Fraunces',serif;">${produit.nom}</p><p class="texte-muted" style="font-size:0.85rem;">${Donnees.formatPrix(produit.prix)}</p></div>
      </div>
      <ul>
        ${collectionProduit ? `<li>Collection : ${collectionProduit.nom}</li>` : ""}
        <li>Dimensions : ${produit.largeur} × ${produit.hauteur} cm</li>
        <li>Épaisseur : ${produit.epaisseur} mm</li>
        <li>Matière : ${LIBELLES_MATIERE[produit.matiere] || produit.matiere}</li>
      </ul>
    </div>`;
  } else if (config) {
    recapHtml = `<div class="bloc-recap" style="display:block;">
      <p class="eyebrow" style="margin-bottom:0.5rem;">Configuration sélectionnée</p>
      <ul>
        ${config.collectionNom ? `<li>Collection : ${config.collectionNom}</li>` : ""}
        ${config.modele ? `<li>Modèle : ${config.modele}</li>` : ""}
        ${config.largeur ? `<li>Dimensions : ${config.largeur} × ${config.hauteur} cm</li>` : ""}
        ${config.epaisseur ? `<li>Épaisseur : ${config.epaisseur} mm</li>` : ""}
        ${config.matiere ? `<li>Matière : ${LIBELLES_MATIERE[config.matiere] || config.matiere}</li>` : ""}
        ${config.couleur ? `<li>Coloris : ${config.couleur}</li>` : ""}
        ${config.prix ? `<li style="grid-column:1/-1;font-weight:500;">Prix estimé : ${Donnees.formatPrix(config.prix)}</li>` : ""}
      </ul>
    </div>`;
  }

  // Fourchettes de budget indicatives par type de projet — la cuisine coûte
  // structurellement plus cher qu'un rangement salon, donc chaque type a sa
  // propre échelle plutôt qu'une fourchette unique pour tout le monde.
  const TYPES_PROJET = {
    cuisine: { libelle: "Cuisine", budgets: ["Moins de 3 000 €", "3 000 – 6 000 €", "6 000 – 10 000 €", "Plus de 10 000 €"] },
    dressing: { libelle: "Dressing", budgets: ["Moins de 1 000 €", "1 000 – 2 000 €", "2 000 – 4 000 €", "Plus de 4 000 €"] },
    "sous-escalier": { libelle: "Aménagement sous escalier", budgets: ["Moins de 800 €", "800 – 1 500 €", "1 500 – 2 500 €", "Plus de 2 500 €"] },
    "rangement-salon": { libelle: "Rangement salon", budgets: ["Moins de 600 €", "600 – 1 200 €", "1 200 – 2 000 €", "Plus de 2 000 €"] },
    // Catégorie ouverte pour tout ce qui sort des 4 cas types (garde-corps
    // d'escalier, brise-vue de fenêtre, claustra d'extérieur…) : le client
    // précise lui-même son projet dans le champ texte qui apparaît.
    autre: { libelle: "Autre", budgets: ["Moins de 1 000 €", "2 500 – 5 000 €", "Plus de 10 000 €"] },
  };

  zone.innerHTML = `
    ${recapHtml}
    <form id="form-devis" novalidate>
      <div style="position:absolute;left:-9999px;" aria-hidden="true">
        <label for="site-web">Ne pas remplir</label>
        <input type="text" id="site-web" tabindex="-1" autocomplete="off" />
      </div>
      <div class="champ-ligne champ-ligne-2">
        <div class="champ"><label for="prenom">Prénom</label><input id="prenom" required minlength="2" /><p class="champ-erreur hidden" data-erreur="prenom"></p></div>
        <div class="champ"><label for="nom">Nom</label><input id="nom" required minlength="2" /><p class="champ-erreur hidden" data-erreur="nom"></p></div>
      </div>
      <div class="champ-ligne champ-ligne-2">
        <div class="champ"><label for="email">Email <span class="texte-muted" style="font-weight:400;">(facultatif)</span></label><input id="email" type="email" /><p class="champ-erreur hidden" data-erreur="email"></p></div>
        <div class="champ"><label for="telephone">Téléphone</label><input id="telephone" type="tel" required /><p class="champ-erreur hidden" data-erreur="telephone"></p></div>
      </div>
      <div class="champ"><label for="ville">Ville</label><input id="ville" required minlength="2" /><p class="champ-erreur hidden" data-erreur="ville"></p></div>
      ${claustraPrecis ? "" : `
      <div class="champ">
        <label for="type-projet">Type de projet</label>
        <select id="type-projet" required>
          <option value="">Sélectionnez…</option>
          ${Object.entries(TYPES_PROJET).map(([slug, t]) => `<option value="${slug}">${t.libelle}</option>`).join("")}
        </select>
        <p class="champ-erreur hidden" data-erreur="type-projet"></p>
      </div>
      <div class="champ hidden" id="champ-precision-projet">
        <label for="precision-projet">Précisez votre projet</label>
        <input id="precision-projet" placeholder="Ex. : escalier, fenêtre…" />
        <p class="champ-erreur hidden" data-erreur="precision-projet"></p>
      </div>`}
      <div class="${claustraPrecis ? "" : "champ-ligne champ-ligne-2"}">
        <div class="champ">
          <label for="delai">C'est pour quand ?</label>
          <select id="delai" required>
            <option value="">Sélectionnez…</option>
            <option value="des-que-possible">Dès que possible</option>
            <option value="1-3-mois">Dans 1 à 3 mois</option>
            <option value="3-6-mois">Dans 3 à 6 mois</option>
            <option value="plus-tard">Plus de 6 mois / je me renseigne</option>
          </select>
          <p class="champ-erreur hidden" data-erreur="delai"></p>
        </div>
        ${claustraPrecis ? "" : `
        <div class="champ">
          <label for="budget">Budget estimé</label>
          <select id="budget" required disabled>
            <option value="">Choisissez d'abord un type de projet</option>
          </select>
          <p class="champ-erreur hidden" data-erreur="budget"></p>
        </div>`}
      </div>
      <div class="champ"><label for="message">Votre projet <span class="texte-muted" style="font-weight:400;">(facultatif)</span></label><textarea id="message" rows="4" minlength="10" placeholder="Décrivez votre projet : pièce concernée, dimensions approximatives, style recherché…"></textarea><p class="champ-erreur hidden" data-erreur="message"></p></div>
      <button type="submit" class="btn btn-primaire btn-full">Envoyer ma demande</button>
    </form>`;

  // Clé Web3Forms (gratuit, sans backend) : les demandes sont envoyées
  // directement par email à l'adresse configurée sur web3forms.com avec
  // cette clé.
  const WEB3FORMS_ACCESS_KEY = "d09f6df6-1abc-4343-bd3e-8e37b1a48c5b";

  const form = document.getElementById("form-devis");
  const boutonEnvoyer = form.querySelector("button[type=submit]");

  // Le budget proposé dépend du type de projet choisi (une cuisine et un
  // rangement salon n'ont pas du tout la même échelle de prix) : le select
  // reste désactivé tant qu'aucun type n'est sélectionné.
  const selectTypeProjet = document.getElementById("type-projet");
  const selectDelai = document.getElementById("delai");
  const selectBudget = document.getElementById("budget");
  const champPrecisionProjet = document.getElementById("champ-precision-projet");
  const inputPrecisionProjet = document.getElementById("precision-projet");
  if (selectTypeProjet) {
    selectTypeProjet.addEventListener("change", () => {
      const type = TYPES_PROJET[selectTypeProjet.value];

      // « Autre » ne correspond à aucune catégorie fixe : on laisse le client
      // décrire lui-même son projet (garde-corps d'escalier, brise-vue de
      // fenêtre…) dans un champ dédié, qui n'apparaît que dans ce cas.
      const estAutre = selectTypeProjet.value === "autre";
      champPrecisionProjet.classList.toggle("hidden", !estAutre);
      inputPrecisionProjet.required = estAutre;
      if (!estAutre) inputPrecisionProjet.value = "";

      if (!type) {
        selectBudget.innerHTML = `<option value="">Choisissez d'abord un type de projet</option>`;
        selectBudget.disabled = true;
        return;
      }
      selectBudget.innerHTML = `<option value="">Sélectionnez…</option>${type.budgets.map((b) => `<option value="${b}">${b}</option>`).join("")}`;
      selectBudget.disabled = false;
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    // Piège à bots : si rempli, on affiche quand même un succès sans rien envoyer.
    const siteWeb = document.getElementById("site-web").value;

    const champs = { prenom: "prenom", nom: "nom", email: "email", telephone: "telephone", ville: "ville", delai: "delai", message: "message" };
    if (selectTypeProjet) Object.assign(champs, { typeProjet: "type-projet", precisionProjet: "precision-projet", budget: "budget" });
    let valide = true;
    document.querySelectorAll(".champ-erreur").forEach((el) => el.classList.add("hidden"));

    for (const id of Object.values(champs)) {
      const input = document.getElementById(id);
      if (!input.checkValidity()) {
        valide = false;
        const erreurEl = document.querySelector(`[data-erreur="${id}"]`);
        erreurEl.textContent = input.validationMessage || "Ce champ est requis.";
        erreurEl.classList.remove("hidden");
      }
    }
    if (!valide) return;

    const valeurs = {
      nom: document.getElementById("nom").value,
      prenom: document.getElementById("prenom").value,
      email: document.getElementById("email").value,
      telephone: document.getElementById("telephone").value,
      ville: document.getElementById("ville").value,
      delai: selectDelai.options[selectDelai.selectedIndex].text,
      message: document.getElementById("message").value,
    };
    if (selectTypeProjet) {
      valeurs.typeProjet = selectTypeProjet.value === "autre"
        ? `Autre : ${inputPrecisionProjet.value}`
        : (TYPES_PROJET[selectTypeProjet.value] || {}).libelle || selectTypeProjet.value;
      valeurs.budget = selectBudget.value;
    }

    let envoiReussi = true;

    if (!siteWeb) {
      // Sauvegarde locale (visible dans le tableau de bord admin de ce navigateur).
      const demandes = JSON.parse(localStorage.getItem("ac_amenagement_devis") || "[]");
      demandes.push({ ...valeurs, produit: produit ? produit.slug : null, configuration: config || null, date: new Date().toISOString() });
      localStorage.setItem("ac_amenagement_devis", JSON.stringify(demandes));

      // Envoi réel par email via Web3Forms.
      boutonEnvoyer.disabled = true;
      boutonEnvoyer.textContent = "Envoi en cours…";
      const recapTexte = produit
        ? `Produit sélectionné : ${produit.nom} — ${produit.largeur}×${produit.hauteur} cm, ${produit.epaisseur} mm, ${LIBELLES_MATIERE[produit.matiere] || produit.matiere} (${Donnees.formatPrix(produit.prix)})`
        : config
          ? `Configuration : ${[config.collectionNom && `Collection ${config.collectionNom}`, config.modele && `Modèle ${config.modele}`, config.largeur && `${config.largeur}×${config.hauteur} cm`, config.epaisseur && `${config.epaisseur} mm`, config.matiere && (LIBELLES_MATIERE[config.matiere] || config.matiere), config.prix && `≈ ${Donnees.formatPrix(config.prix)}`].filter(Boolean).join(" — ")}`
          : "Demande libre (sans produit ni configuration précise).";
      try {
        const reponse = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            access_key: WEB3FORMS_ACCESS_KEY,
            subject: `Nouvelle demande de devis — ${valeurs.prenom} ${valeurs.nom}`,
            from_name: "Site Ac Ligna",
            Prénom: valeurs.prenom,
            Nom: valeurs.nom,
            Email: valeurs.email,
            Téléphone: valeurs.telephone,
            Ville: valeurs.ville,
            ...(selectTypeProjet ? { "Type de projet": valeurs.typeProjet, "Budget estimé": valeurs.budget } : {}),
            "C'est pour quand ?": valeurs.delai,
            Projet: valeurs.message,
            "Récapitulatif": recapTexte,
          }),
        });
        const resultat = await reponse.json();
        envoiReussi = !!resultat.success;
      } catch (err) {
        envoiReussi = false;
      }
    }

    zone.innerHTML = envoiReussi
      ? `<div class="carte text-center" style="border-color:rgba(201,166,107,0.3);background:rgba(201,166,107,0.05);">
          <h3 style="font-size:1.5rem;">${echapperHtml(valeurs.prenom)}, merci pour votre demande !</h3>
          <p class="texte-muted mt-2">Notre équipe vous recontactera sous 48h ouvrées pour échanger sur votre projet.</p>
        </div>`
      : `<div class="carte text-center" style="border-color:rgba(224,82,82,0.3);background:rgba(224,82,82,0.05);">
          <h3 style="font-size:1.5rem;">${echapperHtml(valeurs.prenom)}, votre demande est enregistrée, mais l'envoi a échoué.</h3>
          <p class="texte-muted mt-2">Contactez-nous directement au 06 45 38 13 00 ou à ac.ligna@hotmail.com pour être sûr d'être recontacté.</p>
        </div>`;
  });
</script>
</body>
</html>
