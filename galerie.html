<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="images/logo.png" />
<title>Galerie — AC Aménagement</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .filtres-galerie { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2.5rem; }
  .masonry { columns: 1; gap: 1rem; }
  @media (min-width: 640px) { .masonry { columns: 2; } }
  @media (min-width: 1024px) { .masonry { columns: 3; } }
  .masonry-item { break-inside: avoid; margin-bottom: 1rem; position: relative; border-radius: 1rem; overflow: hidden; background: var(--anthracite); cursor: pointer; }
  .masonry-item img { width: 100%; display: block; transition: transform 0.6s var(--ease); }
  .masonry-item:hover img { transform: scale(1.05); }
  .masonry-legende {
    position: absolute; inset-inline: 0; bottom: 0; padding: 1rem;
    background: linear-gradient(0deg, rgba(0,0,0,0.8), transparent);
    opacity: 0; transition: opacity 0.3s; font-size: 0.85rem;
  }
  .masonry-item:hover .masonry-legende { opacity: 1; }

  .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(10,10,11,0.92); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 1.5rem; }
  .lightbox.ouvert { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 0.5rem; object-fit: contain; }
  .lightbox-bouton { position: absolute; width: 2.75rem; height: 2.75rem; border-radius: 999px; background: rgba(255,255,255,0.1); color: var(--ivoire); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
  .lightbox-bouton:hover { background: rgba(255,255,255,0.2); }
  .lightbox-fermer { top: 1.5rem; right: 1.5rem; }
  .lightbox-precedent { left: 1.5rem; top: 50%; transform: translateY(-50%); }
  .lightbox-suivant { right: 1.5rem; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>

<div id="site-header"></div>

<main>
  <section>
    <div class="container">
      <p class="fil-ariane"><a href="index.html">Accueil</a> › <span class="actif">Galerie</span></p>

      <div class="section-tete reveal">
        <p class="eyebrow">Inspiration</p>
        <h1>Galerie</h1>
        <p class="texte-muted mt-4">Un aperçu en images de nos claustras, cuisines et dressings posés chez nos clients, pièce par pièce.</p>
      </div>

      <div class="filtres-galerie reveal" id="filtres-galerie"></div>
      <div class="masonry" id="masonry"></div>
      <p class="texte-muted mt-8 hidden" id="galerie-vide">Aucune image pour cette catégorie.</p>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-bouton lightbox-fermer" id="lightbox-fermer" aria-label="Fermer">✕</button>
  <button class="lightbox-bouton lightbox-precedent" id="lightbox-precedent" aria-label="Image précédente">‹</button>
  <img id="lightbox-image" src="" alt="" />
  <button class="lightbox-bouton lightbox-suivant" id="lightbox-suivant" aria-label="Image suivante">›</button>
</div>

<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
  const donnees = Donnees.charger();

  // Aplatit toutes les images des réalisations visibles (avant/après/complémentaires).
  const images = [];
  donnees.realisations.forEach((r) => {
    images.push({ url: r.imageApres, categorie: r.categorie, titre: r.titre });
    if (r.imageAvant) images.push({ url: r.imageAvant, categorie: r.categorie, titre: r.titre });
  });

  let categorieActive = null;

  const conteneurFiltres = document.getElementById("filtres-galerie");
  function construireFiltres() {
    conteneurFiltres.innerHTML = "";
    const btnTout = document.createElement("button");
    btnTout.className = "pastille" + (!categorieActive ? " actif" : "");
    btnTout.textContent = "Tout voir";
    btnTout.addEventListener("click", () => { categorieActive = null; rendre(); });
    conteneurFiltres.appendChild(btnTout);

    Object.entries(LIBELLES_CATEGORIE).forEach(([valeur, libelle]) => {
      const btn = document.createElement("button");
      btn.className = "pastille" + (categorieActive === valeur ? " actif" : "");
      btn.textContent = libelle;
      btn.addEventListener("click", () => { categorieActive = valeur; rendre(); });
      conteneurFiltres.appendChild(btn);
    });
  }

  let imagesFiltrees = [];
  const masonry = document.getElementById("masonry");
  const galerieVide = document.getElementById("galerie-vide");

  function rendre() {
    construireFiltres();
    imagesFiltrees = categorieActive ? images.filter((i) => i.categorie === categorieActive) : images;
    masonry.innerHTML = "";
    galerieVide.classList.toggle("hidden", imagesFiltrees.length > 0);
    imagesFiltrees.forEach((img, i) => {
      const el = document.createElement("div");
      el.className = "masonry-item reveal";
      el.style.transitionDelay = `${(i % 6) * 0.05}s`;
      el.innerHTML = `<img src="${img.url}" alt="${img.titre}" loading="lazy" /><div class="masonry-legende">${img.titre}</div>`;
      el.addEventListener("click", () => ouvrirLightbox(i));
      masonry.appendChild(el);
    });
    window.initReveal();
  }

  // ---- Lightbox ----
  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lightbox-image");
  let indexActif = 0;

  function ouvrirLightbox(index) {
    indexActif = index;
    afficherImageActive();
    lightbox.classList.add("ouvert");
  }
  function afficherImageActive() {
    const img = imagesFiltrees[indexActif];
    lightboxImage.src = img.url;
    lightboxImage.alt = img.titre;
  }
  function fermerLightbox() { lightbox.classList.remove("ouvert"); }
  function imageSuivante() { indexActif = (indexActif + 1) % imagesFiltrees.length; afficherImageActive(); }
  function imagePrecedente() { indexActif = (indexActif - 1 + imagesFiltrees.length) % imagesFiltrees.length; afficherImageActive(); }

  document.getElementById("lightbox-fermer").addEventListener("click", fermerLightbox);
  document.getElementById("lightbox-suivant").addEventListener("click", imageSuivante);
  document.getElementById("lightbox-precedent").addEventListener("click", imagePrecedente);
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) fermerLightbox(); });
  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("ouvert")) return;
    if (e.key === "Escape") fermerLightbox();
    if (e.key === "ArrowRight") imageSuivante();
    if (e.key === "ArrowLeft") imagePrecedente();
  });

  rendre();
</script>
</body>
</html>
