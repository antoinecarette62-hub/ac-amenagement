<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="../images/logo.png" />
<title>Connexion — Admin Ac Ligna</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<main style="min-height:100svh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:22rem;">
    <h1 class="text-center" style="font-size:1.75rem;margin-bottom:2rem;">Espace <span class="gold-text">administration</span></h1>

    <form id="form-login">
      <div class="champ">
        <label for="mot-de-passe">Mot de passe</label>
        <input id="mot-de-passe" type="password" required autofocus />
      </div>
      <p class="champ-erreur hidden" id="erreur-login">Mot de passe incorrect.</p>
      <button type="submit" class="btn btn-primaire btn-full mt-4">Se connecter</button>
    </form>
  </div>
</main>

<script src="../js/admin.js"></script>
<script>
  // Si déjà connecté, on renvoie directement au tableau de bord.
  estConnecte().then((connecte) => { if (connecte) location.href = "index.html"; });

  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const motDePasse = document.getElementById("mot-de-passe").value;
    const resultat = await connecter(motDePasse);
    if (resultat === "ok") {
      location.href = "index.html";
      return;
    }
    const erreur = document.getElementById("erreur-login");
    erreur.textContent =
      resultat === "connexion"
        ? "Connexion au serveur d'authentification impossible. Réessayez dans quelques instants."
        : "Mot de passe incorrect.";
    erreur.classList.remove("hidden");
  });
</script>
</body>
</html>
